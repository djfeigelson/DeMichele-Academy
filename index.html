<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Island Decks — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand-50: #fbf6ee;
    --sand-100: #f2e8d5;
    --sand-300: #dcc79a;
    --clay-600: #a8623f;
    --clay-700: #8a4d30;
    --ink-900: #2b241c;
    --ink-600: #5c5245;
    --sea-500: #3f7a72;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 50% -10%, var(--sand-100), var(--sand-50) 55%);
    color: var(--ink-900);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .mark {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    display: block;
  }

  .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sea-500);
    font-weight: 500;
    margin: 0 0 18px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.1rem, 5vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    text-wrap: balance;
    color: var(--clay-700);
  }

  p.lede {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink-600);
    margin: 0 auto;
    max-width: 40ch;
  }

  .divider {
    width: 44px;
    height: 2px;
    background: var(--sand-300);
    margin: 32px auto;
    border-radius: 2px;
  }

  footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--ink-600);
    opacity: 0.75;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --sand-50: #1c1712;
      --sand-100: #241d16;
      --sand-300: #3a2f22;
      --clay-600: #d99a72;
      --clay-700: #e7ab84;
      --ink-900: #f2e9dc;
      --ink-600: #b9ad9a;
      --sea-500: #6fb0a4;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="28" cy="28" r="27" stroke="var(--clay-600)" stroke-width="1.5"/>
      <path d="M14 34c4-10 10-16 14-16s10 6 14 16" stroke="var(--sea-500)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="28" cy="16" r="3.5" fill="var(--clay-600)"/>
    </svg>

    <p class="eyebrow">Desert Island Decks</p>
    <h1>Something's taking shape.</h1>
    <p class="lede">This site is still being built. Check back soon — desertislanddecks.live is on its way.</p>

    <div class="divider"></div>

    <footer>desertislanddecks.live</footer>
  </main>
</body>
</html>
