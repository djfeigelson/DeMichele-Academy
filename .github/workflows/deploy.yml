name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Refuse to publish the wrong file
        run: |
          if ! grep -q "DeMichele Academy" index.html; then
            echo "::error::index.html does not contain 'DeMichele Academy' — refusing to deploy."
            grep -m1 "<title>" index.html || true
            exit 1
          fi
          echo "index.html looks right:"
          grep -m1 "<title>" index.html

      - name: Upload index.html to S3
        run: |
          aws s3 cp index.html s3://demicheleacademy.com/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2BXO9U9HRQJ8Y \
            --paths "/" "/index.html"
